<svg width="780" height="265" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 16px sans-serif; fill: #f8fafc; }
    .subtitle { font: 12px sans-serif; fill: #94a3b8; }
    .label { font: bold 12px sans-serif; fill: #e2e8f0; }
    .seg { font: bold 10px sans-serif; fill: #0f172a; }
    .val { font: 11px monospace; fill: #cbd5e1; }
    .budget { stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 4; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>
  <text x="390" y="30" text-anchor="middle" class="title">Stage Latency Breakdown vs 33.3ms (30 FPS) Frame Budget</text>
  <text x="390" y="50" text-anchor="middle" class="subtitle">Critical-path wall time per frame with ONNX Runtime YOLOv8n</text>
  <line x1="386.1" y1="68" x2="386.1" y2="215" class="budget"/>
  <text x="390.1" y="72" class="subtitle">33.3ms budget</text>
  <text x="20" y="100" class="label">Baseline (Sync)</text>
  <rect x="165.0" y="82" width="349.5" height="26" fill="#f59e0b" rx="3"/>
  <text x="339.8" y="99" text-anchor="middle" class="seg">AI Sync 52.7ms</text>
  <rect x="514.5" y="82" width="8.9" height="26" fill="#10b981" rx="3"/>
  <text x="760" y="100" text-anchor="end" class="val">55.57ms (p95 59.90ms)</text>
  <text x="20" y="150" class="label">Optimized (Async)</text>
  <rect x="165.0" y="132" width="9.0" height="26" fill="#10b981" rx="3"/>
  <text x="760" y="150" text-anchor="end" class="val">2.04ms (p95 2.25ms)</text>
  <text x="20" y="200" class="label">Smart Remux</text>
  <text x="760" y="200" text-anchor="end" class="val">0.15ms (p95 0.07ms)</text>
  <text x="20" y="242" class="subtitle">Note: In Optimized mode, ONNX Runtime inference runs asynchronously off the critical path via DropOldestRingBuffer.</text>
</svg>