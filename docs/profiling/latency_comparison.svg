<svg width="780" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 17px sans-serif; fill: #f8fafc; }
    .subtitle { font: 12px sans-serif; fill: #94a3b8; }
    .label { font: bold 12px sans-serif; fill: #cbd5e1; }
    .sub { font: 11px sans-serif; fill: #94a3b8; }
    .val { font: bold 11px monospace; fill: #f1f5f9; }
    .axis { stroke: #475569; stroke-width: 1.5; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>
  <text x="390" y="32" text-anchor="middle" class="title">Per-Frame Processing Latency: Avg (solid) vs P95 (shaded)</text>
  <text x="390" y="52" text-anchor="middle" class="subtitle">1280x720 @ 30fps, 12s benchmark (lower is faster)</text>
  <line x1="100" y1="260.0" x2="740" y2="260.0" class="grid"/>
  <text x="90" y="264.0" text-anchor="end" class="label">1.9ms</text>
  <line x1="100" y1="200.0" x2="740" y2="200.0" class="grid"/>
  <text x="90" y="204.0" text-anchor="end" class="label">3.7ms</text>
  <line x1="100" y1="140.0" x2="740" y2="140.0" class="grid"/>
  <text x="90" y="144.0" text-anchor="end" class="label">5.6ms</text>
  <line x1="100" y1="80.0" x2="740" y2="80.0" class="grid"/>
  <text x="90" y="84.0" text-anchor="end" class="label">7.4ms</text>
  <line x1="100" y1="320" x2="740" y2="320" class="axis"/>
  <line x1="100" y1="80" x2="100" y2="320" class="axis"/>
  <rect x="150" y="190.2" width="48" height="129.8" fill="#ef4444" rx="4"/>
  <text x="174" y="184.2" text-anchor="middle" class="val">4.01ms</text>
  <rect x="206" y="128.0" width="48" height="192.0" fill="#ef4444" fill-opacity="0.55" rx="4"/>
  <text x="230" y="122.0" text-anchor="middle" class="val">5.93ms</text>
  <text x="202" y="344" text-anchor="middle" class="label">Baseline</text>
  <text x="202" y="362" text-anchor="middle" class="sub">(30.5 fps | 40.6 MB)</text>
  <rect x="340" y="218.0" width="48" height="102.0" fill="#38bdf8" rx="4"/>
  <text x="364" y="212.0" text-anchor="middle" class="val">3.15ms</text>
  <rect x="396" y="157.3" width="48" height="162.7" fill="#38bdf8" fill-opacity="0.55" rx="4"/>
  <text x="420" y="151.3" text-anchor="middle" class="val">5.03ms</text>
  <text x="392" y="344" text-anchor="middle" class="label">Optimized</text>
  <text x="392" y="362" text-anchor="middle" class="sub">(30.2 fps | 46.4 MB)</text>
  <rect x="530" y="316.8" width="48" height="3.2" fill="#10b981" rx="4"/>
  <text x="554" y="310.8" text-anchor="middle" class="val">0.10ms</text>
  <rect x="586" y="318.0" width="48" height="2.0" fill="#10b981" fill-opacity="0.55" rx="4"/>
  <text x="610" y="312.0" text-anchor="middle" class="val">0.02ms</text>
  <text x="582" y="344" text-anchor="middle" class="label">Smart Remux</text>
  <text x="582" y="362" text-anchor="middle" class="sub">(30.2 fps | 23.7 MB)</text>
</svg>