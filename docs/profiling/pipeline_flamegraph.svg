<svg width="780" height="255" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 16px sans-serif; fill: #f8fafc; }
    .subtitle { font: 12px sans-serif; fill: #94a3b8; }
    .label { font: bold 12px sans-serif; fill: #e2e8f0; }
    .seg { font: bold 10px sans-serif; fill: #0f172a; }
    .val { font: 11px monospace; fill: #cbd5e1; }
  </style>
  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>
  <text x="390" y="30" text-anchor="middle" class="title">Pipeline Stage Span Breakdown vs 33.3ms (30 FPS) Frame Budget</text>
  <text x="390" y="50" text-anchor="middle" class="subtitle">Critical-path wall time per frame (avg ms)</text>
  <text x="20" y="98" class="label">Baseline (Sync)</text>
  <rect x="165.0" y="80" width="4.7" height="26" fill="#f59e0b" rx="3"/>
  <rect x="169.7" y="80" width="18.3" height="26" fill="#10b981" rx="3"/>
  <text x="760" y="98" text-anchor="end" class="val">Total 4.01ms (p95 5.93ms)</text>
  <text x="20" y="148" class="label">Optimized (Async)</text>
  <rect x="165.0" y="130" width="37.8" height="26" fill="#10b981" rx="3"/>
  <text x="760" y="148" text-anchor="end" class="val">Total 3.15ms (p95 5.03ms)</text>
  <text x="20" y="198" class="label">Smart Remux</text>
  <text x="760" y="198" text-anchor="end" class="val">Total 0.10ms (p95 0.02ms)</text>
  <text x="20" y="234" class="subtitle">Note: In Optimized mode, AI inference runs asynchronously off the critical frame path via DropOldestRingBuffer.</text>
</svg>