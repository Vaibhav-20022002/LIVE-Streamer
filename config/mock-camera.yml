rtspAddress: :8554
rtspTransports: [tcp, udp]

paths:
  cam1:
    runOnInit: >
      sh -c 'if find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "1p" | grep -q .; then
      if find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "1p" | xargs -I {} ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 {} | grep -qx h264; then
      find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "1p" | xargs -I {} ffmpeg -re -stream_loop -1 -i {} -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      else
      find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "1p" | xargs -I {} ffmpeg -re -stream_loop -1 -i {} -an -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 24 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      fi;
      else
      exec ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=30 -vf "drawbox=x=40:y=60:w=220:h=120:color=red@0.5:t=fill" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -tune zerolatency -g 60 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      fi'
    runOnInitRestart: yes

  cam2:
    runOnInit: >
      sh -c 'if find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "2p" | grep -q .; then
      if find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "2p" | xargs -I {} ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 {} | grep -qx h264; then
      find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "2p" | xargs -I {} ffmpeg -re -stream_loop -1 -i {} -an -c:v copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      else
      find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | sort | sed -n "2p" | xargs -I {} ffmpeg -re -stream_loop -1 -i {} -an -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 24 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      fi;
      else
      exec ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=30 -vf "drawbox=x=80:y=100:w=240:h=140:color=blue@0.5:t=fill" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -tune zerolatency -g 60 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      fi'
    runOnInitRestart: yes
