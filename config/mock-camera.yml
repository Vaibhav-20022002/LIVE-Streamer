rtspAddress: :8554
rtspTransports: [tcp, udp]

paths:
  live:
    runOnInit: >
      sh -c 'sample=$(find /media -maxdepth 1 -type f -name "*.mp4" 2>/dev/null | head -n 1);
      if [ -n "$sample" ]; then
      exec ffmpeg -re -stream_loop -1 -i "$sample" -an -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 24 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      else
      exec ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=30 -vf "drawbox=x=40:y=60:w=220:h=120:color=red@0.5:t=fill" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -tune zerolatency -g 60 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH;
      fi'
    runOnInitRestart: yes
